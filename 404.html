<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Sunny Chen</title>
<style>
  :root{
    --paper:#000000;
    --ink:#F2F2EE;
    --grey:#8A8A85;
    --line:#2A2A29;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;
    letter-spacing:-.32px;line-height:1.4;
    min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .topnav{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px calc(4.5vw + 4px);
  }
  .nav-logo{
    text-decoration:none;color:#FFFFFF;
    font-weight:400;font-size:12px;letter-spacing:.06em;line-height:1;
    display:inline-flex;align-items:center;gap:10px;
    transition:opacity .15s ease;
  }
  .nav-logo:hover{opacity:.6;}
  .nav-logo .arrow{display:inline-block;transition:transform .18s ease;}
  .nav-logo:hover .arrow{transform:translateX(-4px);}
  .nav-links{display:flex;gap:44px;}
  .nav-links a{
    position:relative;text-decoration:none;color:var(--grey);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    transition:color .15s ease;white-space:nowrap;
  }
  .nav-links a:hover{color:var(--ink);}
  .nav-links a::after{
    content:"";position:absolute;left:-4px;right:-4px;top:50%;
    height:1px;background:currentColor;
    transform:scaleX(0);transform-origin:left center;
    transition:transform .22s ease;
  }
  .nav-links a:hover::after{transform:scaleX(1);}

  main{
    flex:1;display:flex;align-items:center;
    padding:0 calc(4.5vw + 4px);
  }
  .inner{max-width:920px;}
  .code{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--grey);margin-bottom:20px;
  }
  h1{
    font-weight:700;
    font-size:clamp(2.4rem,8vw,6.5rem);
    line-height:1.0;letter-spacing:-0.035em;
    margin:0 0 22px;
  }
  p{color:var(--grey);max-width:44ch;margin:0 0 40px;}
  .back{
    display:inline-block;text-decoration:none;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding-bottom:6px;border-bottom:1px solid var(--line);
    transition:border-color .2s ease;
  }
  .back:hover{border-color:var(--ink);}

  footer{
    padding:28px calc(4.5vw + 4px);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--grey);border-top:1px solid var(--line);
  }

  /* footer contact block — shared across every page */
  footer{display:block;}
  footer .foot-contact{
    display:flex;flex-wrap:wrap;column-gap:56px;row-gap:10px;
    padding-bottom:22px;margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  footer .fc-item{display:flex;align-items:baseline;gap:12px;}
  footer .fc-k{
    color:var(--grey);
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    white-space:nowrap;
  }
  footer .fc-v{color:var(--ink);font-size:12px;letter-spacing:-.01em;}
  footer .fc-links{display:flex;gap:20px;}
  footer .foot-contact a{
    color:var(--ink);font-size:12px;text-decoration:none;
    border-bottom:1px solid var(--line);padding-bottom:2px;
    transition:color .15s ease,border-color .15s ease;
  }
  footer .foot-contact a:hover{
    color:var(--design,var(--ink));border-color:var(--design,var(--ink));
  }
  footer .foot-row{
    display:grid;grid-template-columns:1fr auto 1fr;
    align-items:end;gap:16px;
  }
  @media (max-width:900px){
    footer .foot-contact{flex-direction:column;row-gap:12px;}
    footer .foot-row{grid-template-columns:1fr;gap:14px;}
  }

  /* footer sits on its own solid band — the background grid stops at its top edge */
  footer{
    position:relative;z-index:2;
    background:var(--paper);
    border-top:1px solid var(--line);
  }

  /* tighter vertical rhythm in the footer */
  footer{padding-top:20px;padding-bottom:20px;}
  footer .foot-contact{padding-bottom:16px;margin-bottom:16px;}
  @media (max-width:900px){
    footer{padding-top:16px;padding-bottom:16px;}
  }

  /* footer — email flush left, social flush right, credit on its own line */
  footer .foot-contact{
    display:flex;justify-content:space-between;align-items:baseline;
    flex-wrap:wrap;column-gap:40px;row-gap:10px;
    padding-bottom:16px;margin-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  footer .fc-links{display:flex;gap:24px;}
  footer .foot-contact a{
    color:var(--ink);font-size:12px;text-decoration:none;
    border-bottom:1px solid var(--line);padding-bottom:2px;
    transition:color .15s ease,border-color .15s ease;
  }
  footer .foot-contact a:hover{
    color:var(--design,var(--ink));border-color:var(--design,var(--ink));
  }
  footer .foot-row{display:block;text-align:left;}
  footer .foot-credit{color:var(--grey);font-size:11px;}
  @media (max-width:900px){
    footer .foot-contact{flex-direction:column;align-items:flex-start;row-gap:12px;}
  }

  /* no rules, no underlines — hover carries the affordance */
  footer .foot-contact{border-bottom:none;padding-bottom:0;margin-bottom:12px;}
  footer .foot-contact a{border-bottom:none;padding-bottom:0;}
  footer .foot-contact a:hover{color:var(--design,var(--ink));}

  /* transparent footer — background grid shows through again */
  footer{background:transparent;border-top:none;}
  footer .foot-contact{
    display:flex;flex-direction:column;align-items:flex-start;
    row-gap:8px;margin-bottom:14px;
  }
  footer .fc-links{display:flex;gap:24px;}
  footer .foot-row{display:block;text-align:center;}

  /* links and credit share one row: links flush left, credit centred in the footer */
  footer .foot-contact{
    display:block;margin-bottom:12px;
    border-bottom:none;padding-bottom:0;
  }
  footer .foot-row{
    display:grid;grid-template-columns:1fr auto 1fr;
    align-items:baseline;gap:16px;text-align:left;
  }
  footer .fc-links{display:flex;gap:24px;}
  footer .foot-credit{text-align:center;color:var(--grey);font-size:11px;}
  footer a.fc-mail,
  footer .fc-links a{
    color:var(--ink);font-size:12px;text-decoration:none;
    border-bottom:none;padding-bottom:0;
    transition:color .15s ease;
  }
  footer a.fc-mail:hover,
  footer .fc-links a:hover{color:var(--design,var(--ink));}
  @media (max-width:900px){
    footer .foot-row{grid-template-columns:1fr;gap:10px;}
    footer .foot-credit{text-align:left;}
  }

  /* credit line — lighter than the default grey */
  footer .foot-credit{color:#B0B0AB;}

  footer .foot-credit{color:#C9C9C3;}

  footer .foot-credit{color:#ffffff4d;}
</style>
</head>

    <a class="fc-mail" href="mailto:sunny.chingyunchen@gmail.com">sunny.chingyunchen@gmail.com</a>
  </div>
  <div class="foot-row">
    <span class="fc-links">
      <a href="https://www.linkedin.com/in/chingyunchen/" target="_blank" rel="noopener">LinkedIn &#8599;</a>
      <a href="https://medium.com/@chingyunchen" target="_blank" rel="noopener">Medium &#8599;</a>
    </span>
    <span class="foot-credit">&#169;2026 crafted by Sunny Chen</span>
    <span></span>
  </div>
</footer>

</body>
</html>
